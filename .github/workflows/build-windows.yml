name: Build Windows Desktop App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Portable Package
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .\零散改点工具\requirements-build.txt

      - name: Static syntax & secret leak check
        shell: pwsh
        run: |
          $pyFiles = Get-ChildItem -Recurse -Filter "*.py" -Path ".\零散改点工具", ".\.agents\skills\scattered-revision\scripts"
          foreach ($f in $pyFiles) {
            python -m py_compile $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "Syntax error in $($f.FullName)" }
          }
          $hits = Select-String -Path ($pyFiles | ForEach-Object { $_.FullName }) -Pattern "(AIza[0-9A-Za-z_-]{16,}|AQ\.[0-9A-Za-z._-]{16,}|ya29\.[0-9A-Za-z._-]{16,}|dpapi:v1:[A-Za-z0-9+/]{12,})"
          if ($hits) {
            Write-Error "Hardcoded secret pattern detected!"
            exit 1
          }
          Write-Host "Syntax & secret checks passed ($($pyFiles.Count) Python files)."

      - name: Build standalone Windows EXE with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name "零散改点整理工具" `
            --distpath ".\dist_pkg" `
            --workpath ".\build_work" `
            --specpath ".\build_spec" `
            --paths ".\零散改点工具" `
            --paths ".\.agents\skills\scattered-revision\scripts" `
            --add-data ".\.agents\skills\scattered-revision\scripts;skill_scripts" `
            --hidden-import docx_xml_utils `
            --hidden-import step1_extract_and_diff `
            --hidden-import step1_render_draft `
            --hidden-import step2_parse_reviewed `
            --hidden-import step2_render_final `
            --hidden-import ai_client `
            --hidden-import lang_registry `
            --hidden-import security_utils `
            --hidden-import pipeline `
            ".\零散改点工具\app_gui.py"

          if (-not (Test-Path ".\dist_pkg\零散改点整理工具.exe")) {
            throw "EXE build failed: 零散改点整理工具.exe not found."
          }

      - name: Assemble Windows portable ZIP & SHA-256 checksum
        shell: pwsh
        run: |
          $stageDir = ".\release_stage\零散改点整理工具_Windows"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item ".\dist_pkg\零散改点整理工具.exe" -Destination $stageDir
          Copy-Item ".\零散改点工具\languages.json" -Destination $stageDir
          Copy-Item ".\零散改点工具\使用说明.md" -Destination $stageDir
          Copy-Item ".\零散改点工具\.env.example" -Destination $stageDir

          New-Item -ItemType Directory -Force -Path ".\artifact_out" | Out-Null
          $zipPath = ".\artifact_out\ScatteredRevisionTool-Windows-x64.zip"
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipPath -Force

          $exeHash = (Get-FileHash ".\dist_pkg\零散改点整理工具.exe" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  零散改点整理工具.exe",
            "$zipHash  ScatteredRevisionTool-Windows-x64.zip"
          ) | Set-Content -Encoding UTF8 ".\artifact_out\SHA256SUMS.txt"
          Get-Content ".\artifact_out\SHA256SUMS.txt"

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ScatteredRevisionTool-Windows-x64
          path: |
            artifact_out/ScatteredRevisionTool-Windows-x64.zip
            artifact_out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download built Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ScatteredRevisionTool-Windows-x64
          path: release_assets

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $notes = @(
            "## 零散改点自动整理工具 ($env:TAG_NAME) - Windows 免安装便携版",
            '',
            '- 解压 `ScatteredRevisionTool-Windows-x64.zip` 后双击 `零散改点整理工具.exe` 即可运行（无需安装 Python 或第三方依赖）。',
            '- 支持 **无限多 API Key 自动轮换 & 报错/超额秒切**（兼容 Vertex AI Key 与 Gemini Key）。',
            '- 支持 **35+ 多语种自由新增扩展**（外置 `languages.json`）。',
            '- 本机保存密钥采用 **Windows DPAPI** 系统级加密，磁盘与日志零明文泄露。',
            '- 附带 `SHA256SUMS.txt` 文件完整性校验值。'
          ) -join "`n"

          gh release view "$env:TAG_NAME" --repo "$env:REPO_SLUG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG_NAME" `
              ".\release_assets\ScatteredRevisionTool-Windows-x64.zip" `
              ".\release_assets\SHA256SUMS.txt" `
              --clobber --repo "$env:REPO_SLUG"
          } else {
            gh release create "$env:TAG_NAME" `
              ".\release_assets\ScatteredRevisionTool-Windows-x64.zip" `
              ".\release_assets\SHA256SUMS.txt" `
              --title "零散改点自动整理工具 $env:TAG_NAME (Windows x64)" `
              --notes "$notes" `
              --repo "$env:REPO_SLUG"
          }

name: Build Windows Desktop App

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    name: Build Windows x64 Portable Package
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build, verify, and package Windows portable ZIP
        shell: pwsh
        run: |
          python .\.github\scripts\ci_build_windows.py

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ScatteredRevisionTool-Windows-x64
          path: |
            artifact_out/ScatteredRevisionTool-Windows-x64.zip
            artifact_out/SHA256SUMS.txt
            artifact_out/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download built Windows package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ScatteredRevisionTool-Windows-x64
          path: release_assets

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$env:TAG_NAME" --repo "$env:REPO_SLUG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG_NAME" `
              ".\release_assets\ScatteredRevisionTool-Windows-x64.zip" `
              ".\release_assets\SHA256SUMS.txt" `
              --clobber --repo "$env:REPO_SLUG"
          } else {
            gh release create "$env:TAG_NAME" `
              ".\release_assets\ScatteredRevisionTool-Windows-x64.zip" `
              ".\release_assets\SHA256SUMS.txt" `
              --title "Scattered Revision Tool $env:TAG_NAME (Windows x64)" `
              --notes-file ".\release_assets\RELEASE_NOTES.md" `
              --repo "$env:REPO_SLUG"
          }
